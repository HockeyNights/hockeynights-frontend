name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - preprod
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/hockeynights/hockeynights-frontend
  HUSKY: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Runtime deps only: forcing minimatch@10 for eslint/jsx-a11y breaks the linter API.
      # High/critical in eslint toolchain stay out of the hard gate (see docs/hocfront-17-customer-nav-requirements.md §3.1).
      - name: Dependency audit (runtime)
        run: npm audit --audit-level=high --omit=dev

      # Full tree (incl. devDeps) — advisory only; does not fail the job.
      - name: Dependency audit (full, advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  deploy:
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/preprod')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/develop' && 'dev' || 'qa' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.ref == 'refs/heads/develop' && 'dev-latest' || 'qa-latest' }}
      VITE_API_MODE: ${{ vars.VITE_API_MODE || 'mock' }}
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || '/api/v1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_API_MODE=${{ env.VITE_API_MODE }}
            VITE_BACKEND_URL=${{ env.VITE_BACKEND_URL }}
          cache-from: type=gha,scope=${{ env.IMAGE_TAG }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_TAG }}

      - name: Copy compose file to Proxmox host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.yml
          target: /opt/hockeynights/

      - name: Deploy on Proxmox host
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_PORT: ${{ vars.APP_PORT || '8081' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE,IMAGE_TAG,GHCR_TOKEN,GHCR_USER,APP_PORT
          script: |
            set -euo pipefail
            cd /opt/hockeynights

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            export IMAGE="${IMAGE}:${IMAGE_TAG}"
            export APP_PORT="${APP_PORT}"

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            docker compose ps

      - name: Verify deployment health
        uses: appleboy/ssh-action@v1
        env:
          APP_PORT: ${{ vars.APP_PORT || '8081' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_PORT
          script: |
            set -euo pipefail
            curl -fsS "http://127.0.0.1:${APP_PORT}/" -o /dev/null
            echo "Deployed ${{ github.ref_name }} (${{ env.VITE_API_MODE }}) → port ${APP_PORT}"
